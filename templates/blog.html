<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs · #sh0ds-devblog</title>
    <link rel="stylesheet" href="/stylesheets/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="sh0ds@devblog">sh0ds<span>@devblog</span></a>
        <nav aria-label="Main">
            <ul>
                <li><a href="/blog/index.html" aria-current="page">logs</a></li>
                <li><a href="/projects/index.html">binaries</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="dashboard">
            <div class="status-header">
                <h1>System Logs</h1>
                <div class="status-badge">
                    <span class="dot"></span> ARCHIVE
                </div>
            </div>
        </section>

        <section class="activity-feed">
            {{#posts}}
            <div class="feed-item">
                <time datetime="{{ date }}">{{ date }}</time>
                <div class="content">
                    <h3><a href="/{{ url }}">{{ title }}</a></h3>
                    <p>{{ summary }}</p>
                </div>
            </div>
            {{/posts}}
        </section>
    </main>

    <footer class="site-footer">
        <p><small>rasberry-pizian • rpi5 • debian • c11</small></p>
        <ul>
            <li><a href="https://github.com/sh0ds">github</a></li>
            <li><a href="https://sh0ds.itch.io">itch.io</a></li>
            <li><a href="mailto:mail@sh0ds.dev">signal</a></li>
        </ul>
    </footer>

    <script src="/main.js" defer></script>
</body>
</html>
