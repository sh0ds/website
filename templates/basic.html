<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · #sh0ds-devblog</title>
    <link rel="stylesheet" href="../stylesheets/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="sh0ds@devblog">sh0ds<span>@devblog</span></a>
        <nav aria-label="Main">
            <ul>
                <li><a href="/blog/index.html">logs</a></li>
                <li><a href="/projects/index.html">binaries</a></li>

    <main>

    <footer class="site-footer">

        <ul>
            <li><a href="https://github.com/sh0ds">github</a></li>
            <li><a href="https://sh0ds.itch.io">itch.io</a></li>
            <li><a href="mailto:mail@sh0ds.dev">signal</a></li>
        </ul>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
    <script src="/main.js" defer></script>
</body>
</html>
