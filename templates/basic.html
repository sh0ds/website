<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · #sh0ds-devblog</title>
    <link rel="stylesheet" href="/stylesheets/styles.css">
</head>
<body>
    <header class="site-header">
        <img class="logo" src="/images/raspberry.svg" alt="" width="42" height="45">
        <p class="release">Raspberry Pi 5 Model B · 8 GB</p>
        <dl class="diag">
            <div><dt>board</dt><dd><a class="brand" href="/" aria-label="sh0ds@devblog, home">sh0ds@devblog</a></dd></div>
            <div><dt>boot</dt><dd><nav aria-label="Main"><ul><li><a href="/blog/index.html">/blog</a></li><li><a href="/projects/index.html">/projects</a></li></ul></nav></dd></div>
        </dl>
        <a class="qr" href="https://github.com/sh0ds/website"><img src="/images/qr-repo.svg" alt="QR code for github.com/sh0ds/website" width="99" height="99"><span>sh0ds/website</span></a>
    </header>

    <main>
        <article>
            <h1>{{ title }}</h1>
            <dl class="diag meta">
                <div><dt>date</dt><dd>{{ date }}</dd></div>
                <div><dt>by</dt><dd>{{ author }}</dd></div>
                <div><dt>msg</dt><dd>{{ summary }}</dd></div>
            </dl>
            <div class="body">
                {{ content }}
            </div>
            <p class="eof">EOF · <a href="/">back to /</a></p>
        </article>
    </main>

    <footer class="site-footer">
        <dl class="diag">
            <div><dt>net</dt><dd><ul><li><a href="https://github.com/sh0ds">github</a></li><li><a href="https://sh0ds.itch.io/">itch.io</a></li><li><a href="mailto:mail@sh0ds.dev">mail</a></li></ul></dd></div>
            <div><dt>src</dt><dd><a href="https://github.com/sh0ds/website">sh0ds/website</a>, built with <a href="/projects/3sgc.html">3sgc</a></dd></div>
            <div><dt>info</dt><dd>© 2026 sh0ds</dd></div>
        </dl>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
    <script src="/main.js" defer></script>
</body>
</html>
