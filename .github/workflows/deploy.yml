name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /srv/repo
            git fetch origin main
            git reset --hard origin/main
            
            rsync -av --delete /srv/repo/ /var/www/site-new/
            rm -rf /srv/www
            mv /var/www/site-new /srv/www
            
